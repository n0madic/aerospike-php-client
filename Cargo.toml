[package]
name = "aerospike_php"
version = "2.0.0-dev"
edition = "2021"
authors = ["Khosrow Afroozeh <khosrow@aerospike.com>", "Sachin Venkatesha Murthy <smurthy@aerospike.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
aerospike = { version = "2.1", features = ["sync", "rt-tokio", "tls", "serialization"], default-features = false }
ext-php-rs = "0.15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
ordered-float = { version = "3", default-features = false }
hex = "0.4"
log = "0.4"

# TLS configuration (rustls + PEM file loading + Mozilla CA bundle).
# tokio-rustls is pulled in transitively via `aerospike[tls]`; declaring it directly
# (with matching default features so the same crypto provider — aws-lc-rs — is used)
# lets us construct `ClientConfig` values in user-facing API.
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
uuid = { version = "1.2.2", features = ["v4", "fast-rng"] }
anyhow = "1"

[profile.release]
strip = "debuginfo"
