on:
  push:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [
          # x86_64 — `macos-14-large` is a paid GitHub Actions runner. Re-enable
          # once billing is configured.
          # macos-14-large,
          # ARM64 (free)
          macos-14
        ]
        php-version: [
          '8.1',
          '8.2',
          '8.3',
          '8.4',
          '8.5'
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install dependencies
        run: |
          brew install \
            phpunit \
            php@${{ matrix.php-version }}
          # php executable isn't accessible in PATH by default
          echo /opt/homebrew/opt/php@${{ matrix.php-version }}/bin >> $GITHUB_PATH
          echo /opt/homebrew/opt/php@${{ matrix.php-version }}/sbin >> $GITHUB_PATH
      - name: Get only major and minor version to target build
        run: echo MACOS_VERSION=$(sw_vers --productVersion | cut -f -2 -d'.') >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php-version }}
      - name: Build PHP client
        run: make
        env:
          # By default the compiler tries to build for macos 11.0
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_VERSION }}
          # The `-undefined dynamic_lookup` linker flag lives in .cargo/config.toml
          # (single source); setting RUSTFLAGS here would silently override it.

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-24.04, # x86_64
          ubuntu-24.04-arm
        ]
        php-version: [
          '8.1',
          '8.2',
          '8.3',
          '8.4',
          '8.5'
        ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Run CE server
      run: docker run -d -p 3000:3000 --name aerospike aerospike/aerospike-server:8.1.2.3

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get list of all packages
      run: sudo apt update
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        # phpize pulls in php$version-dev, which provides the headers and php-config
        # that ext-php-rs needs. Do not apt-install php$version-{dev,mbstring,xml}
        # below: setup-php now installs PHP from its own package cache and that
        # installer deletes the ondrej PPA apt lists, so those packages are both
        # unavailable to apt and already present.
        tools: phpize
    - name: Install prerequisites
      run: |
        sudo apt -y install \
          phpunit \
          build-essential \
          rustup
    - name: Download and install latest Rust
      run: sudo rustup default stable

    - name: Add clippy component
      run: rustup component add clippy

    - uses: Swatinem/rust-cache@v2
      with:
        key: php-${{ matrix.php-version }}

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build PHP client
      run: make build

    - name: Install PHP client
      run: sudo make install-only

    - name: Wait for server to start
      run: sleep 3

    - name: Run only non-security tests
      env:
        AEROSPIKE_HOSTS: 127.0.0.1:3000
      run: sudo -E phpunit --testsuite non_security_tests

    - name: Tear down server
      run: |
        docker stop aerospike
        docker container prune -f

    - name: Run EE server with security enabled
      run: docker run -d --mount type=bind,src=$(pwd)/configs,dst=/opt/aerospike/etc -p 3000:3000 --name aerospike aerospike/aerospike-server-enterprise:8.1.2.3 asd --config-file /opt/aerospike/etc/aerospike.conf
      working-directory: .github/workflows
    - name: Wait for server to start
      run: sleep 3
    - name: Show logs for debugging
      run: docker logs aerospike
    - name: Add superuser for testing
      run: docker exec aerospike asadm --user admin --password admin --enable -e "manage acl create user superuser password superuser roles read-write-udf sys-admin user-admin data-admin"

    - name: Run only security tests
      env:
        AEROSPIKE_HOSTS: 127.0.0.1:3000
        AEROSPIKE_USER: superuser
        AEROSPIKE_PASSWORD: superuser
      run: sudo -E phpunit --testsuite security_tests
