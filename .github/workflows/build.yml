on:
  push:
    branches:
      - main
      - stage
      - v2-native-client
    tags:
      - 'v*'

jobs:
  build-php-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cpu_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            cpu_arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            build-essential \
            pkg-config \
            libssl-dev \
            php-dev \
            rpm

      - name: Install Rust
        # Pinned to a commit (mutable branch refs are a supply-chain risk); the action
        # still installs the current stable toolchain via its `toolchain: stable` default.
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build Aerospike PHP client library
        run: cargo build --release

      - name: Fetch tags
        run: git fetch --tags

      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/v//') || latest_tag="2.0.0"
          echo "tag=${latest_tag:-2.0.0}" >> "$GITHUB_OUTPUT"

      - name: Substitute placeholders in deb control
        run: |
          sed -i "s/@VERSION@/${{ steps.get_tag.outputs.tag }}/g" pkg/deb/control
          sed -i "s/@ARCH@/${{ matrix.deb_arch }}/g" pkg/deb/control

      - name: Package for deb (${{ matrix.deb_arch }})
        run: |
          mkdir -p pkg/deb/aerospike-php-client-deb/DEBIAN
          mkdir -p pkg/deb/aerospike-php-client-deb/usr/lib

          cp target/release/libaerospike_php.so pkg/deb/aerospike-php-client-deb/usr/lib

          cp pkg/deb/control pkg/deb/aerospike-php-client-deb/DEBIAN/
          cp pkg/deb/scripts/postinst pkg/deb/aerospike-php-client-deb/DEBIAN/

          dpkg-deb --build pkg/deb/aerospike-php-client-deb
          mv pkg/deb/aerospike-php-client-deb.deb \
             pkg/deb/aerospike-php-client-${{ steps.get_tag.outputs.tag }}-${{ matrix.cpu_arch }}.deb

      - name: Upload DEB ${{ matrix.cpu_arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerospike-php-client-deb-${{ matrix.cpu_arch }}
          path: pkg/deb/aerospike-php-client-${{ steps.get_tag.outputs.tag }}-${{ matrix.cpu_arch }}.deb

      - name: Package for rpm (${{ matrix.rpm_arch }})
        run: |
          version="${{ steps.get_tag.outputs.tag }}"
          rpm_arch="${{ matrix.rpm_arch }}"
          src_root="${{ github.workspace }}/rpmbuild-src/aerospike-php-client-${version}"
          mkdir -p "$src_root"
          cp target/release/libaerospike_php.so "$src_root/"
          cp pkg/rpm/scripts/postinst "$src_root/"

          mkdir -p "${{ github.workspace }}/rpmbuild/SOURCES"
          tar -C "${{ github.workspace }}/rpmbuild-src" -czf \
              "${{ github.workspace }}/rpmbuild/SOURCES/aerospike-php-client-${version}.tar.gz" \
              "aerospike-php-client-${version}"

          rpmbuild \
            --define "_topdir ${{ github.workspace }}/rpmbuild" \
            --define "VERSION ${version}" \
            --target "${rpm_arch}" \
            -bb pkg/rpm/aerospike-php-client.spec

          mkdir -p pkg/rpm/out
          cp "${{ github.workspace }}/rpmbuild/RPMS/${rpm_arch}"/*.rpm \
             "pkg/rpm/out/aerospike-php-client-${version}-${rpm_arch}.rpm"

      - name: Upload RPM ${{ matrix.rpm_arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerospike-php-client-rpm-${{ matrix.rpm_arch }}
          path: pkg/rpm/out/aerospike-php-client-${{ steps.get_tag.outputs.tag }}-${{ matrix.rpm_arch }}.rpm
